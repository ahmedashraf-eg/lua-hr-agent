<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Assistant</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 2rem;
        line-height: 1.6;
        color: #16211d;
      }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      p  { color: #4a5a54; }
      ul { color: #4a5a54; padding-left: 1.2rem; }
      li { margin-bottom: 0.35rem; }
    </style>
  </head>
  <body>
    <h1>HR Assistant</h1>
    <p>
      Leave, end-of-service, onboarding, Iqama renewals and HR requests —
      in Arabic or English.
    </p>
    <ul>
      <li>How many annual leave days do I have left?</li>
      <li>كم رصيد إجازتي السنوية؟</li>
      <li>I need a salary certificate</li>
      <li>متى تنتهي إقامتي؟</li>
    </ul>

    <script src="https://lua-ai-global.github.io/lua-pop/lua-pop.umd.js"></script>
    <script>
      window.LuaPop.init({
        agentId: "baseAgent_agent_1788171476995_6gsfvk1sh",

        // REQUIRED. Without it the widget defaults to staging (api.lua.dev)
        // and asks that API about an agent deployed to production
        // (api.heylua.ai) — every request comes back
        // "401 No token or session ID provided".
        //
        // It also bypasses the domain whitelist, which matters because
        // localhost cannot be whitelisted in the dashboard.
        environment: "production",

        position: "bottom-right",
        chatTitle: "HR Assistant",
        buttonText: "Ask HR",
        chatInputPlaceholder: "Ask about leave, gratuity or Iqama…",
      });
    </script>
  </body>
</html>
